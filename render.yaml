services:
  - type: web
    name: text-classifier-backend
    runtime: python
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: MIN_SAMPLES_FOR_BERT
        value: "10"
